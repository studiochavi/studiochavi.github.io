<style>
/* Layout: one centred column for the client; progress band per project, then payments. Same palette as the studio CRM. */
:root{
  --bg:#F6F4F2; --surface:#FFFFFF; --surface-2:#F2EFEC; --ink:#1A2233; --muted:#7C818C; --line:#ECE8E4;
  --accent:#E2747A; --accent-soft:#FBE4E4; --accent-ink:#FFFFFF;
  --ok:#2F8A5B; --ok-soft:#E1F3E8; --warn:#AD3F52; --warn-soft:#FBE4E4; --bad:#C8434B; --bad-soft:#FBE2E3;
  --shadow:0 1px 2px rgba(26,34,51,.04),0 8px 24px rgba(26,34,51,.05);
  --f-display:"Rubik",system-ui,sans-serif; --f-body:"Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161B; --surface:#1D2027; --surface-2:#262A32; --ink:#ECEDEF; --muted:#9AA0AB; --line:#2E323A;
  --accent:#F08A90; --accent-soft:#3D2629; --accent-ink:#1A0F10;
  --ok:#6DC795; --ok-soft:#1D3527; --warn:#F08A90; --warn-soft:#3D2629; --bad:#F07C82; --bad-soft:#3D2224;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161B; --surface:#1D2027; --surface-2:#262A32; --ink:#ECEDEF; --muted:#9AA0AB; --line:#2E323A;
  --accent:#F08A90; --accent-soft:#3D2629; --accent-ink:#1A0F10;
  --ok:#6DC795; --ok-soft:#1D3527; --warn:#F08A90; --warn-soft:#3D2629; --bad:#F07C82; --bad-soft:#3D2224;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;object-fit:cover;background:var(--surface-2);color:var(--muted);font-weight:500;font-size:14px;border:1px solid var(--line);overflow:hidden}
img.av{background:#fff;object-fit:cover}
.av.xl{width:68px;height:68px;font-size:26px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.pg-top{background:linear-gradient(to left,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 35%,var(--surface)));padding:24px 28px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:end}
.pg-eyebrow{font-family:var(--f-display);font-size:26px;font-weight:500;line-height:1.2}
.pg-sub{color:var(--muted);font-size:14.5px}
.pg-pct{text-align:end}
.pg-pct b{display:block;font-family:var(--f-display);font-size:42px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.pg-pct span{color:var(--muted);font-size:14px}
.pg-bar{grid-column:1/-1;height:9px;border-radius:99px;background:color-mix(in srgb,var(--surface) 75%,transparent);overflow:hidden;margin-top:10px}
.pg-bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.pg-steps{list-style:none;margin:0;padding:26px 10px 28px;display:flex;overflow-x:auto}
.pg-steps li{flex:1 0 112px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;padding:0 4px}
.pg-steps .dot{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted);font-family:var(--f-display);font-size:20px;position:relative;z-index:1}
.pg-steps li.done .dot{background:var(--accent);color:var(--accent-ink)}
.pg-steps li.cur .dot{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 6px var(--accent-soft)}
.pg-steps li:not(:last-child)::after{content:"";position:absolute;top:28px;height:3px;border-radius:3px;background:var(--surface-2);inset-inline-start:calc(50% + 40px);inset-inline-end:calc(-50% + 40px)}
.pg-steps li.done::after{background:var(--accent)}
.pg-steps .nm{font-weight:500;font-size:15px;max-width:15ch;line-height:1.3;margin-top:6px}
.pg-steps li:not(.done):not(.cur) .nm{color:var(--muted)}
.pg-steps .dt{font-size:12.5px;color:var(--muted)}
.pg-steps .here{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:600;margin-top:4px}

document.addEventListener("click", async e => {
